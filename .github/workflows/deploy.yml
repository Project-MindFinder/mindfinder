# ============================================
# MindFinder CD
# --------------------------------------------
# GitHub Secrets (Settings > Secrets and variables > Actions):
#   TS_OAUTH_CLIENT_ID  : Tailscale OAuth client ID (tag:ci)
#   TS_OAUTH_SECRET     : Tailscale OAuth client secret
#   DEPLOY_HOST         : 서버 Tailscale IP
#   DEPLOY_USER         : SSH 사용자 (deploy)
#   DEPLOY_SSH_KEY      : SSH 개인키 전체
#   DEPLOY_PATH         : /opt/mindfinder
#   DISCORD_TOKEN       : 봇 토큰
#   GUILD_ID            : 디스코드 서버 ID
#   (선택) TS_OAUTH_TAGS
# ============================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: tailscale-ssh-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ secrets.TS_OAUTH_TAGS || 'tag:ci' }}

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write .env on server
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "cat > ${{ secrets.DEPLOY_PATH }}/.env" << EOF
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          GUILD_ID=${{ secrets.GUILD_ID }}
          RESET_VERIFICATIONS_ON_START=false
          EOF

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'bash -s' < scripts/deploy.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: main
